# Precompute build-time generated files outside the Vercel build.
#
# The related graph, blog index, search index and R2 content sync took
# ~20 min, later ~4 min, of every Vercel build (2-core builder, one after the
# other). These two jobs run them in parallel on GitHub runners and upload the
# results to R2; the Vercel build waits for both and downloads them
# (scripts/generatedR2.ts fetch). Runs on every push to main so each deploy
# finds results for its own commit.
name: Build-time generated files

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, in push order: a later commit's results must land last.
concurrency:
  group: related-graph
  cancel-in-progress: false

env:
  R2_GATEWAY_URL: ${{ secrets.R2_GATEWAY_URL }}
  R2_GATEWAY_SECRET: ${{ secrets.R2_GATEWAY_SECRET }}

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore force-layout cache
        uses: actions/cache@v4
        with:
          path: .next/cache/blog-graph-layout.json
          key: graph-layout-${{ github.sha }}
          restore-keys: graph-layout-

      - run: npm run build-blog-index
      - run: npm run build-related-graph
      - run: npx tsx scripts/generatedR2.ts put graph

  indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run build-blog-index
      - run: npm run build-search-index
      # Before the upload: once the sha lands, the deploy serves this commit's
      # posts, so their markdown must already be in R2.
      - run: npm run sync-content
      - run: npx tsx scripts/generatedR2.ts put indexes
